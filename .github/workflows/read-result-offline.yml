name: Bridge result retrieval (offline)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  read-result-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out bridge
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run provider-free result and document-slot tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest -v test_result_reader.py test_latest_response_slot.py
